# Which firmware satisfies which machine option, by SHA-1 (see sinclair/firmware.toml for the format).

# ---- C64: the US/EU revision 3 set first, older revisions after it.

[[rom]]
machines = ["c64"]
option = "rom_kernal"
label = "C64 KERNAL"
sha1 = [
  "1d503e56df85a62fee696e7618dc5b4e781df1bb", # 901227-03 (rev 3)
  "0e2e4ee3f2d41f00bed72f9ab588b83e306fdb13", # 901227-02 (rev 2)
  "87cc04d61fc748b82df09856847bb5c2754a2033", # 901227-01 (rev 1)
]

[[rom]]
machines = ["c64"]
option = "rom_basic"
label = "C64 BASIC"
sha1 = ["79015323128650c742a3694c9429aa91f355905e"] # 901226-01

[[rom]]
machines = ["c64"]
option = "rom_char"
label = "C64 character ROM"
sha1 = ["adc7c31e18c7c7413d54802ef2f4193da14711aa"] # 901225-01


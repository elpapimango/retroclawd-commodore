machine = "vic20"
# Firmware and reference-derived goldens are supplied separately, never committed.
# Uncaptured S3/S7 goldens require the matching rc-scenarios feature change.

[reference]
emulator = "VICE xvic"
version = "3.9 GTK3 Win64; xvic.exe SHA256 a385207b21df29459f5304bf6ed1da90c974512ead3a7ce1e340c46b01d3134f"
command = "xvic -default -console -pal|-ntsc -basic BASIC -kernal KERNAL -chargen CHAR -drive8type 0 -drive9type 0 -drive10type 0 -drive11type 0 +sound -warp -limitcycles CYCLES -exitscreenshot OUTPUT.png -logfile OUTPUT.log; S2 adds -keybuf 'print 12*34\\n'. See docs/vic20-gaps.md for cycles, logical-pixel goldens and audio commands."

[files]
rom-basic = "commodore/roms/vic20/basic-901486-01.bin"
rom-kernal = "commodore/roms/vic20/kernal-901486-07.bin"
rom-char = "commodore/roms/vic20/chargen-901460-03.bin"


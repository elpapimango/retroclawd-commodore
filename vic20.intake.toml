size = 4096
sha1 = "4fd85ab6647ee2ac7ba40f729323f2472d35b9b4"
hash_source = "MAME 848a0b5b0ab016f2fb22f259c9fc7eba0cfe8605 src/mame/commodore/vic20.cpp"

[firmware_policy]
redistribution_permission = "Not established; firmware is not included. The configured RomM supplied private verification inputs."
local_vic20_firmware_found = true
note = "All four Machine firmware hashes and 1541 DOS ab16f56989b27d89babe5f89c5a8cb3da71a82f0 were downloaded through the Host's firmware-auto path and verified before use. Hashes identify bytes, not permission. The archive index lists 901486-04 as 8191 bytes; do not silently pad or accept that as an 8192-byte ROM."

[scenarios]
required = ["S1 boot", "S2 input", "S3 each supported medium", "S4 audio", "S5 state and reset", "S6 timing", "S7 hardware diagnostics"]
optional = ["S8 instruction trace"]
removed = []
overrides = []
hardware_diagnostics = "VIC-20 Dead Test v1.1.01 by Simon Rowe / Greg McCarthy / Piers Finlayson, GPL-3.0 at the release source pin below. Cartridge + base RAM checks real regional ROM CRCs; replacement regional KERNAL + 35k expansion passes all 42 displayed RAM checks. All eight mode/region/configuration runs match 1024 reference memory bytes exactly. No test plugs required. This does not test VIA/IEC/tape/analogue fidelity or BLK5 expansion RAM."
status = "62 passed, 0 failed, 0 known scenario gaps: S1-S7 cover both modes and regions with real firmware; PAL volume-7, complete Drive state, raw/addressed cartridge/reset/state and both external diagnostic configurations also pass. Experimental fidelity limits remain documented."
note = "Do not create passing manifest entries or weaken tolerances from this intake. Preserve all standard scenarios."


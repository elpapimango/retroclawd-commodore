machine = "vic20"
display_name = "Commodore VIC-20"
family = "commodore"
default_region = "pal"

[implementation]
status = "experimental"
boot_verified = true
note = "Real PAL/NTSC boots, BASIC input, tools-built PRG/cassette/disk LOAD, calibrated audio, state continuation and frame budgets pass in fast and accurate modes. VICE 3.9 boot/input/program/cassette/disk goldens are hash-pinned. Cartridge, diagnostics and additional fidelity work remain open. See docs/vic20-gaps.md."

[core]
reuse = "mos6502"
variant = "NMOS MOS 6502, not the C64's 6510 with its on-chip port"
tests = ["Klaus Dormann functional test", "Tom Seddon instruction tests"]

[chips]
reuse = ["via6522"]
new = ["MOS 6561 VIC-I (PAL)", "MOS 6560 VIC-I (NTSC)"]
note = "Do not substitute VIC-II or SID. VIC-I supplies both video and sound."
via_limit = "The existing VIA shift-register implementation documents simplified completion timing and does not model serial data movement. Verify and extend it before claiming serial/user-port fidelity."

[reference]
emulator = "VICE"
version = "3.9 GTK3 Win64"
executable = "xvic"
binary_sha256 = "a385207b21df29459f5304bf6ed1da90c974512ead3a7ce1e340c46b01d3134f"
hardware_source_revision = "4d283a2e7dd59b7e378524878e81ecc7826b700c"
installed = true
goldens_captured = true
note = "The installed executable identifies itself as VICE 3.9; its build is not independently reproduced. The separate hardware-source pin is VICE 3.10.0. Commands, crop conversion and measured audio differences are recorded in docs/vic20-gaps.md."

[timing.pal]
clock_hz = 1108405
cycles_per_line = 71
lines = 312
cycles_per_frame = 22152
source = "VICE 3.10.0 vice/src/vic20/vic20.h"

[timing.ntsc]
clock_hz = 1022727
cycles_per_line = 65
equivalent_full_lines = 261
first_line_cycles = 32
last_line_cycles = 33
cycles_per_frame = 16965
source = "VICE 3.10.0 vice/src/vic20/vic20.h"
note = "The noninterlaced first and last partial lines add to one complete line. Interlace requires separate field scheduling; do not treat 261 equivalent lines as 261 identical raster rows."

[memory]
ram = ["0000-03ff", "1000-1fff"]
optional_ram = ["0400-0fff", "2000-3fff", "4000-5fff", "6000-7fff", "a000-bfff"]
character_rom = "8000-8fff"
vic = "9000-900f"
via1 = "9110-911f"
via2 = "9120-912f"
color_ram = "9400-97ff"
expansion_io = ["9800-9bff", "9c00-9fff"]
basic_rom = "c000-dfff"
kernal_rom = "e000-ffff"
note = "Base RAM totals 5 KiB. Verify incomplete Chip decode and simultaneous VIA selection, not just nominal addresses. Unconnected reads follow bus behavior; they are not uniformly ff. Color RAM has four stored bits and bus-driven upper bits."

[wiring]
via1_interrupt = "CPU NMI"
via2_interrupt = "CPU IRQ"
via1_port_a = ["IEC clock in", "IEC data in", "joystick up", "joystick down", "joystick left", "joystick fire/light pen", "cassette sense", "IEC ATN out"]
via2_port_b = "Keyboard column selection; PB3 also cassette write, PB7 also joystick right"
via2_port_a = "Keyboard row input; verify reverse-direction scans"
via1_ca1 = "Restore key"
via1_ca2 = "Cassette motor"
via2_ca1 = "Cassette read"
via2_ca2 = "IEC clock out"
via2_cb1 = "IEC SRQ in"
via2_cb2 = "IEC data out"
iec_polarity = "VIA1 PA7 and VIA2 CA2/CB2 drive inverting IEC buffers: a high output asserts the physical line low. VIA1 PA0/PA1 read physical CLOCK/DATA levels."
iec_source = "VICE 3.10.0 vice/src/vic20/vic20iec.c, iec_pa_write, iec_pcr_write and resolve_bus_signals."

[keyboard]
note = "Each entry lists Port A bits 0-7 for a selected Port B bit, following MAME's actual via2_pa_r and COL inputs. The earlier intake transposed this wiring by reading the VICE diagram's row/column comment literally. MAME's input path and the VICE keymap/rev_keyarr path agree with the matrix below. Aliases and shifted combinations are implemented."
matrix = [
  ["Digit1", "Digit3", "Digit5", "Digit7", "Digit9", "Plus", "Pound", "Delete"],
  ["LeftArrow", "KeyW", "KeyR", "KeyY", "KeyI", "KeyP", "Asterisk", "Return"],
  ["Control", "KeyA", "KeyD", "KeyG", "KeyJ", "KeyL", "Semicolon", "CursorLeftRight"],
  ["RunStop", "ShiftLeft", "KeyX", "KeyV", "KeyN", "Comma", "Slash", "CursorUpDown"],
  ["Space", "KeyZ", "KeyC", "KeyB", "KeyM", "Period", "ShiftRight", "F1"],
  ["Commodore", "KeyS", "KeyF", "KeyH", "KeyK", "Colon", "Equals", "F3"],
  ["KeyQ", "KeyE", "KeyT", "KeyU", "KeyO", "At", "UpArrow", "F5"],
  ["Digit2", "Digit4", "Digit6", "Digit8", "Digit0", "Minus", "Home", "F7"],
]

[video_audio]
register_range = "9000-900f"
features = ["programmable screen origin and dimensions", "8x8 and 8x16 characters", "monochrome and multicolor characters", "16 colors", "border and background", "raster readback", "three tone generators", "noise generator", "shared volume", "paddle conversion", "light pen"]
note = "The primary guide says VIC-I refresh does not insert CPU wait states. Accurate scheduling must reproduce VIC-I fetches and register visibility, not copy C64 bad-line stalls."
open_questions = ["full-border geometry, PAL/NTSC palette and pixel aspect", "exact fetch phases and bus retention", "polyphonic phase, noise waveform and analogue accuracy beyond the reference calibration", "interlace field behavior", "paddle and light-pen timing"]

[media]
candidate_reuse = ["Commodore TAP pulse Format", "PRG load-address convention", "D64 Format", "1541 and drive-link"]
supported = ["raw programs through --program/--org", "PRG/P00 headers through the existing Host parser", "read-only VIC-20 TAP v0/v1, platform 1, matching PAL/NTSC", "writable D64 through a real 1541 at IEC device 8 with true_drive"]
note = "Datasette PLAY is pressed on attach; VIA1 PA6 sense, active-low CA2 motor, VIA2 CA1 falling READ edge per full pulse. Shared TapePlayer/KERNAL encoder and 1541/drive-link are reused. Drive CPU steps at instruction granularity in both modes; no loader trap. No recording, motor inertia, or physical rising-edge phase. Do not advertise C64 CRT cartridges or other Drive models/formats."

[[firmware]]
option = "basic"
part = "901486-01"
size = 8192
sha1 = "587d1e90950675ab6b12d91248a3f0d640d02e8d"
hash_source = "MAME 848a0b5b0ab016f2fb22f259c9fc7eba0cfe8605 src/mame/commodore/vic20.cpp"


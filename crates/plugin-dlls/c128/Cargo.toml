[package]
name = "c128-machine-plugin-dll"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
description = "Shared-library build of c128-machine-plugin: only the C entry points, all logic lives in c128-machine-plugin"

[lib]
name = "c128_machine_plugin"

[dependencies]
plugin-api = { git = "https://github.com/elpapimango/retroclawd-crates", rev = "b5375a3c5477ad4e485eaf78da6fbf19e7292a4b" }
c128-machine-plugin = { path = "../../plugins/c128-machine-plugin" }

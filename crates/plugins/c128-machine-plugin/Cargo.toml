[package]
name = "c128-machine-plugin"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"

[lib]
name = "c128_machine_plugin_impl"

[dependencies]
build-info = { git = "https://github.com/elpapimango/retroclawd-crates", rev = "ae53253565d8bd34ebba7bdde8acebe55b9c028c" }
machine = { git = "https://github.com/elpapimango/retroclawd-crates", rev = "ae53253565d8bd34ebba7bdde8acebe55b9c028c" }
plugin-api = { git = "https://github.com/elpapimango/retroclawd-crates", rev = "ae53253565d8bd34ebba7bdde8acebe55b9c028c" }
mos6502 = { git = "https://github.com/elpapimango/retroclawd-crates", rev = "ae53253565d8bd34ebba7bdde8acebe55b9c028c" }
z80 = { git = "https://github.com/elpapimango/retroclawd-crates", rev = "ae53253565d8bd34ebba7bdde8acebe55b9c028c" }
serde = { version = "1", features = ["derive"] }
c128 = { path = "../../machines/c128" }
c1541 = { path = "../../machines/1541" }
drive-link = { path = "../../machines/drive-link" }
d64 = { path = "../../formats/d64" }
g64 = { path = "../../formats/g64" }
d71 = { path = "../../formats/d71" }
d81 = { path = "../../formats/d81" }

[dev-dependencies]
toml = "0.8"

[build-dependencies]
build-info = { git = "https://github.com/elpapimango/retroclawd-crates", rev = "ae53253565d8bd34ebba7bdde8acebe55b9c028c" }

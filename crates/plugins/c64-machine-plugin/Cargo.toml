[package]
name = "c64-machine-plugin"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"

[lib]
name = "c64_machine_plugin_impl"

[dependencies]
build-info = { git = "https://github.com/elpapimango/retroclawd-crates", rev = "30bbca84f53177148c6ed4ae2b37597747dec654" }
machine = { git = "https://github.com/elpapimango/retroclawd-crates", rev = "30bbca84f53177148c6ed4ae2b37597747dec654" }
plugin-api = { git = "https://github.com/elpapimango/retroclawd-crates", rev = "30bbca84f53177148c6ed4ae2b37597747dec654" }
mos6502 = { git = "https://github.com/elpapimango/retroclawd-crates", rev = "30bbca84f53177148c6ed4ae2b37597747dec654" }
serde = { version = "1", features = ["derive"] }
c64 = { path = "../../machines/c64" }
c1541 = { path = "../../machines/1541" }
drive-link = { path = "../../machines/drive-link" }
c64-tape = { path = "../../formats/c64-tape" }
c64-cartridge = { path = "../../formats/c64-cartridge" }
d64 = { path = "../../formats/d64" }
g64 = { path = "../../formats/g64" }
d71 = { path = "../../formats/d71" }
d81 = { path = "../../formats/d81" }

[dev-dependencies]
toml = "0.8"

[build-dependencies]
build-info = { git = "https://github.com/elpapimango/retroclawd-crates", rev = "30bbca84f53177148c6ed4ae2b37597747dec654" }
